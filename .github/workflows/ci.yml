name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  domain-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality tools
        run: python -m pip install --disable-pip-version-check ".[dev]"
      - name: Lint
        run: ruff check ros_ws/src/amr_fleet_core/amr_fleet_core ros_ws/src/amr_fleet_core/test
      - name: Type check
        run: mypy ros_ws/src/amr_fleet_core/amr_fleet_core
      - name: Run unit tests
        run: python -m unittest discover -s ros_ws/src/amr_fleet_core/test -v
      - name: Compile Python sources
        run: python -m compileall -q ros_ws/src/amr_fleet_core/amr_fleet_core ros_ws/src/amr_fleet_core/test
