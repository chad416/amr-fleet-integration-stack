fleet:
  name: portfolio_amr_fleet
  map_frame: map
  max_active_missions_per_robot: 1
  minimum_dispatch_battery_percent: 30.0
  critical_battery_percent: 15.0
  telemetry_stale_after_seconds: 3.0
  station_lease_seconds: 30.0

dispatch:
  policy: nearest_eligible
  tie_breaker: robot_id
  reject_degraded_robots: true

robots:
  - id: amr_01
    namespace: /amr_01
    base_frame: base_link
    odom_frame: odom
    charger_waypoint: charger_01

