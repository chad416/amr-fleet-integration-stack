apiVersion: 1

deleteDatasources:
  - name: AMR InfluxDB
    orgId: 1

datasources:
  - name: AMR InfluxDB
    uid: influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: amr
      defaultBucket: amr_fleet
      tlsSkipVerify: false
    secureJsonData:
      token: $INFLUX_TOKEN
