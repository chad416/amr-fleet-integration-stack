<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">AMR software acceptance dashboard and simulation route</title>
  <desc id="desc">A portfolio visual showing a schematic factory route and the results of the 100-run non-hardware software acceptance campaign.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#13243a"/></linearGradient>
    <linearGradient id="route" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".27"/></filter>
    <style>
      .title { font: 700 28px Inter, Segoe UI, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 14px Inter, Segoe UI, sans-serif; fill: #94a3b8; }
      .eyebrow { font: 700 12px Inter, Segoe UI, sans-serif; letter-spacing: 1.8px; fill: #94a3b8; }
      .kpi { font: 700 30px Inter, Segoe UI, sans-serif; fill: #f8fafc; }
      .kpiLabel { font: 400 12px Inter, Segoe UI, sans-serif; fill: #cbd5e1; }
      .mapLabel { font: 700 12px Inter, Segoe UI, sans-serif; fill: #e2e8f0; }
      .small { font: 400 11px Inter, Segoe UI, sans-serif; fill: #94a3b8; }
    </style>
  </defs>
  <rect width="1200" height="700" rx="24" fill="url(#bg)"/>
  <text x="50" y="58" class="title">Reproducible software acceptance snapshot</text>
  <text x="50" y="84" class="subtitle">Simulation-first evidence for missions, station handshakes, traffic coordination and degraded modes</text>

  <rect x="44" y="119" width="542" height="516" rx="18" fill="#0f1b31" stroke="#243b5a"/>
  <text x="70" y="151" class="eyebrow">SCHEMATIC DIGITAL-TWIN ROUTE</text>
  <text x="70" y="174" class="small">The committed factory map and Nav2 route are exercised headlessly in CI.</text>
  <rect x="70" y="200" width="490" height="385" rx="14" fill="#111827" stroke="#334155"/>
  <path d="M104 236 H522 M104 334 H522 M104 432 H522 M104 530 H522" stroke="#243b53" stroke-width="18"/>
  <path d="M180 216 V570 M350 216 V570 M480 216 V570" stroke="#243b53" stroke-width="18"/>
  <path d="M112 506 C162 506 178 506 214 506 C255 506 258 353 312 353 C367 353 365 264 410 264 C450 264 456 359 505 359" fill="none" stroke="url(#route)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M112 506 C162 506 178 506 214 506 C255 506 258 353 312 353 C367 353 365 264 410 264 C450 264 456 359 505 359" fill="none" stroke="#ecfeff" stroke-opacity=".35" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="112" cy="506" r="12" fill="#38bdf8" stroke="#e0f2fe" stroke-width="3"/><text x="96" y="548" class="mapLabel">HOME</text>
  <circle cx="312" cy="353" r="11" fill="#34d399" stroke="#d1fae5" stroke-width="3"/><text x="276" y="388" class="mapLabel">INFEED</text>
  <circle cx="410" cy="264" r="11" fill="#fbbf24" stroke="#fef3c7" stroke-width="3"/><text x="377" y="239" class="mapLabel">INSPECTION</text>
  <circle cx="505" cy="359" r="11" fill="#a78bfa" stroke="#ede9fe" stroke-width="3"/><text x="448" y="397" class="mapLabel">OUTFEED</text>
  <rect x="96" y="226" width="70" height="32" rx="8" fill="#1e293b"/><text x="110" y="247" class="small">aisle A</text>
  <rect x="262" y="458" width="90" height="32" rx="8" fill="#1e293b"/><text x="279" y="479" class="small">crossing</text>
  <rect x="406" y="466" width="80" height="32" rx="8" fill="#1e293b"/><text x="424" y="487" class="small">aisle B</text>
  <text x="70" y="610" class="small">Map revision: factory-v1 · deterministic waypoints · bounded motion</text>

  <rect x="614" y="119" width="542" height="516" rx="18" fill="#0f1b31" stroke="#243b5a"/>
  <text x="640" y="151" class="eyebrow">NON-HARDWARE SOFTWARE FAT · 100 RUNS</text>
  <g filter="url(#shadow)">
    <rect x="640" y="184" width="238" height="116" rx="14" fill="#115e59"/><text x="666" y="224" class="kpi">100 / 100</text><text x="666" y="250" class="kpiLabel">pseudo-docking missions completed</text><text x="666" y="272" class="small">success rate 100%</text>
    <rect x="902" y="184" width="228" height="116" rx="14" fill="#1e3a8a"/><text x="928" y="224" class="kpi">0</text><text x="928" y="250" class="kpiLabel">station mutual-exclusion</text><text x="928" y="272" class="small">violations recorded</text>
    <rect x="640" y="322" width="238" height="116" rx="14" fill="#164e63"/><text x="666" y="362" class="kpi">100 / 100</text><text x="666" y="388" class="kpiLabel">traffic conflicts rejected</text><text x="666" y="410" class="small">0 rollback failures · 0 deadlocks</text>
    <rect x="902" y="322" width="228" height="116" rx="14" fill="#4c1d95"/><text x="928" y="362" class="kpi">5 / 5</text><text x="928" y="388" class="kpiLabel">degraded-mode scenarios</text><text x="928" y="410" class="small">hold / return-home decisions passed</text>
  </g>
  <rect x="640" y="466" width="490" height="122" rx="14" fill="#111827" stroke="#334155"/>
  <text x="666" y="496" class="eyebrow">EVIDENCE CHAIN</text>
  <text x="666" y="524" class="kpiLabel">73 domain tests  ·  20 simulation/navigation contracts  ·  CI ROS/Gazebo gates</text>
  <text x="666" y="549" class="kpiLabel">100-run JSON evidence  ·  Grafana dashboard artifact  ·  fault campaign 5/5</text>
  <text x="666" y="576" class="small">Hardware commissioning and physical safety validation are intentionally outside this snapshot.</text>
</svg>
