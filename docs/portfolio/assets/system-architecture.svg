<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">AMR and fleet integration stack architecture</title>
  <desc id="desc">A simulation-first architecture connecting operator and WMS clients to a fleet domain, ROS 2 autonomy, Gazebo or a future physical AMR, PLC station integration and Grafana telemetry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111d33"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" x2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title { font: 700 28px Inter, Segoe UI, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 14px Inter, Segoe UI, sans-serif; fill: #94a3b8; }
      .lane { font: 700 12px Inter, Segoe UI, sans-serif; letter-spacing: 1.8px; fill: #94a3b8; }
      .node { font: 700 15px Inter, Segoe UI, sans-serif; fill: #f8fafc; }
      .small { font: 400 12px Inter, Segoe UI, sans-serif; fill: #dbeafe; }
      .line { fill: none; stroke: #7dd3fc; stroke-width: 2.2; marker-end: url(#arrow); opacity: .9; }
      .dashed { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 7 7; }
    </style>
  </defs>
  <rect width="1200" height="680" rx="24" fill="url(#bg)"/>
  <text x="54" y="58" class="title">AMR + fleet integration stack</text>
  <text x="54" y="84" class="subtitle">Simulation-first autonomy with explicit ROS 2, OT and observability boundaries</text>

  <rect x="34" y="116" width="1132" height="128" rx="18" fill="#0f1b31" stroke="#243b5a"/>
  <text x="58" y="143" class="lane">OPERATIONS &amp; BUSINESS SYSTEMS</text>
  <g filter="url(#shadow)">
    <rect x="58" y="162" width="190" height="60" rx="12" fill="url(#blue)"/>
    <text x="82" y="188" class="node">Operator / HMI</text><text x="82" y="208" class="small">mission + override</text>
    <rect x="284" y="162" width="190" height="60" rx="12" fill="url(#blue)"/>
    <text x="317" y="188" class="node">WMS / MES</text><text x="317" y="208" class="small">work orders</text>
    <rect x="520" y="162" width="220" height="60" rx="12" fill="#1d4ed8"/>
    <text x="574" y="188" class="node">Fleet HTTP API</text><text x="571" y="208" class="small">JSON commands + snapshots</text>
    <rect x="786" y="162" width="330" height="60" rx="12" fill="#1e3a8a"/>
    <text x="853" y="188" class="node">Mission + dispatch domain</text><text x="862" y="208" class="small">leases · traffic · recovery · policy</text>
  </g>
  <path d="M248 192 H284 M474 192 H520 M740 192 H786" class="line"/>

  <rect x="34" y="270" width="1132" height="190" rx="18" fill="#0f1b31" stroke="#243b5a"/>
  <text x="58" y="297" class="lane">ROBOT AUTONOMY &amp; DIGITAL TWIN</text>
  <g filter="url(#shadow)">
    <rect x="58" y="318" width="205" height="108" rx="12" fill="url(#teal)"/>
    <text x="94" y="348" class="node">ROS 2 fleet adapter</text><text x="91" y="371" class="small">actions · services · telemetry</text><text x="101" y="392" class="small">lifecycle-aware bring-up</text>
    <rect x="312" y="318" width="205" height="108" rx="12" fill="#0f766e"/>
    <text x="369" y="348" class="node">Nav2 lifecycle</text><text x="363" y="371" class="small">AMCL · planner · controller</text><text x="368" y="392" class="small">collision monitor + recovery</text>
    <rect x="566" y="318" width="205" height="108" rx="12" fill="#115e59"/>
    <text x="616" y="348" class="node">ros2_control</text><text x="611" y="371" class="small">diff-drive controller</text><text x="628" y="392" class="small">limits + odometry + TF</text>
    <rect x="820" y="318" width="296" height="108" rx="12" fill="url(#teal)"/>
    <text x="874" y="348" class="node">Gazebo twin / physical AMR</text><text x="899" y="371" class="small">lidar · IMU · encoders</text><text x="900" y="392" class="small">same mission boundary, new adapter</text>
  </g>
  <path d="M740 222 V272 H160 V318 M263 372 H312 M517 372 H566 M771 372 H820" class="line"/>
  <path d="M160 426 V445 H970 V426" class="dashed"/>
  <text x="492" y="454" class="subtitle">simulation and hardware share the validated control boundary</text>

  <rect x="34" y="486" width="550" height="158" rx="18" fill="#0f1b31" stroke="#243b5a"/>
  <text x="58" y="513" class="lane">OT / MATERIAL-HANDLING CELL</text>
  <g filter="url(#shadow)">
    <rect x="58" y="535" width="208" height="76" rx="12" fill="url(#violet)"/><text x="107" y="566" class="node">OT bridge</text><text x="89" y="589" class="small">lease correlation + timeout</text>
    <rect x="310" y="535" width="236" height="76" rx="12" fill="#5b21b6"/><text x="382" y="566" class="node">PLC / station</text><text x="363" y="589" class="small">MQTT runtime · OPC UA codec</text>
  </g>
  <path d="M472 222 V500 H162 V535 M266 573 H310" class="line"/>

  <rect x="614" y="486" width="552" height="158" rx="18" fill="#0f1b31" stroke="#243b5a"/>
  <text x="638" y="513" class="lane">OBSERVABILITY &amp; EVIDENCE</text>
  <g filter="url(#shadow)">
    <rect x="638" y="535" width="214" height="76" rx="12" fill="#0e7490"/><text x="705" y="566" class="node">Telemetry</text><text x="672" y="589" class="small">snapshots + audit events</text>
    <rect x="896" y="535" width="238" height="76" rx="12" fill="#155e75"/><text x="955" y="566" class="node">InfluxDB / Grafana</text><text x="946" y="589" class="small">KPIs · alarms · operations view</text>
  </g>
  <path d="M390 426 V500 H745 V535 M852 573 H896" class="line"/>
</svg>
