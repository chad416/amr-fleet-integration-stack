controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    enforce_command_limits: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    base_controller:
      type: diff_drive_controller/DiffDriveController

base_controller:
  ros__parameters:
    left_wheel_names: [left_wheel_joint]
    right_wheel_names: [right_wheel_joint]
    wheel_separation: 0.46
    wheel_radius: 0.09

    odom_frame_id: odom
    base_frame_id: base_footprint
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.01, 0.01, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.01, 0.01, 0.01]

    position_feedback: true
    open_loop: false
    enable_odom_tf: true
    publish_rate: 50.0
    cmd_vel_timeout: 0.5
    publish_limited_velocity: true
    velocity_rolling_window_size: 10

    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.8
    linear.x.min_velocity: -0.35
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 0.7
    linear.x.min_acceleration: -0.9
    linear.x.has_jerk_limits: true
    linear.x.max_jerk: 2.0
    linear.x.min_jerk: -2.0

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.4
    angular.z.min_velocity: -1.4
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 1.8
    angular.z.min_acceleration: -1.8
    angular.z.has_jerk_limits: true
    angular.z.max_jerk: 4.0
    angular.z.min_jerk: -4.0
