amr_fleet_adapter:
  ros__parameters:
    station_ids:
      - station_infeed
      - station_outfeed
    minimum_battery_percent: 30.0
    telemetry_stale_after_seconds: 3.0
    station_lease_seconds: 30.0
    recovery_max_attempts: 3
    telemetry_publish_period_seconds: 1.0
    waypoint_records_json: >
      [
        {
          "station_id": "station_infeed",
          "name": "infeed_dock",
          "approach_pose": {"x": 3.8, "y": 2.7, "yaw": 0.0, "frame_id": "map"}
        },
        {
          "station_id": "station_outfeed",
          "name": "outfeed_dock",
          "approach_pose": {"x": 3.8, "y": -2.7, "yaw": 0.0, "frame_id": "map"}
        }
      ]
